name: Auto Update Conflict & Satellite Data

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # data ships via auto-merged PR
  issues: write # failure alerts

# Serialize data-updating workflows so concurrent runs don't fail their push
# (shared with update-memorial.yml — one data commit pipeline at a time).
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch & publish verified conflict headlines
        run: node scripts/headline-monitor.js --publish

      - name: Update consumer impact, war costs, and casualty telemetry
        run: node scripts/daily-stats-update.js --no-git

      - name: Refresh NASA FIRMS VIIRS satellite snapshot
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node scripts/fetch-firms-snapshot.js

      - name: Validate TypeScript types before committing
        run: npm run typecheck

      # Data ships as a pull request from an unprotected branch, so the
      # require-PR ruleset on main is satisfied by design — no PAT, no
      # bypass, and the data commit passes the full CI gate before landing.
      - name: Ship data update via auto-merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Sujaya Nimneth"
          git config user.email "sujayanimneth@outlook.com"
          git add \
            public/auto-events.json \
            public/auto-events-archive.json \
            src/features/impact/data/auto-consumer-impact.json \
            src/features/timeline/data/auto-war-costs.json \
            public/auto-daily-stats.json \
            public/firms-latest.json \
            scripts/draft-events.json \
            scripts/seen-headlines.json \
            scripts/youtube-latest.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          git commit -m "data(auto): scheduled conflict, market, and satellite update ($TODAY)"
          # Stay current with main, then move the commit to the data branch
          git fetch origin main
          git rebase origin/main
          BRANCH=data/auto-update
          git checkout -B "$BRANCH"
          git push --force origin "$BRANCH"
          # (Re)use a single standing PR for the branch
          gh pr create --head "$BRANCH" \
            --title "data(auto): conflict, market, and satellite update ($TODAY)" \
            --body "Automated data-pipeline update. Merges automatically once checks pass." \
            --label data-update 2>/dev/null || echo "Reusing existing open PR"
          # --auto waits for required checks when auto-merge is enabled;
          # otherwise (no required checks yet) the PR is immediately mergeable
          gh pr merge "$BRANCH" --squash --auto --delete-branch || \
          gh pr merge "$BRANCH" --squash --delete-branch || {
            echo "::error::Data PR could not be merged — check required checks/approval settings"
            exit 1
          }

      # A failed scheduled run otherwise fails silently and the site serves
      # ever-staler data — file (or update) an alert issue instead.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Data pipeline failure — auto-update"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ISSUE_NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Scheduled run failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "A scheduled data-update run failed: $RUN_URL" --label "pipeline-alert" || \
            gh issue create --title "$TITLE" --body "A scheduled data-update run failed: $RUN_URL"
          fi
