name: Auto Update Conflict & Satellite Data

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write # failure alerts

# Serialize data-updating workflows so concurrent runs don't fail their push
# (shared with update-memorial.yml — one data commit pipeline at a time).
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify push token identity
        env:
          PUSH_TOKEN: ${{ secrets.DATA_PUSH_TOKEN }}
        run: |
          # Trim paste artifacts (trailing newline/space) that break auth headers
          PUSH_TOKEN="$(printf '%s' "$PUSH_TOKEN" | tr -d '[:space:]')"
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::warning::DATA_PUSH_TOKEN not set — push will use the default token and may be blocked by branch rules"
            exit 0
          fi
          # Length only — never the value. classic PAT = 40, fine-grained = 93
          echo "Token length: ${#PUSH_TOKEN}"
          LOGIN=$(curl -sf -H "Authorization: Bearer $PUSH_TOKEN" https://api.github.com/user | grep -o '"login":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
          if [ "$LOGIN" != "Sujaya-Nimneth" ]; then
            echo "::error::DATA_PUSH_TOKEN authenticates as '${LOGIN:-<invalid token>}' — expected 'Sujaya-Nimneth'. Regenerate the token and update the secret."
            exit 1
          fi
          echo "Push identity verified: $LOGIN"

      - name: Fetch & publish verified conflict headlines
        run: node scripts/headline-monitor.js --publish

      - name: Update consumer impact, war costs, and casualty telemetry
        run: node scripts/daily-stats-update.js --no-git

      - name: Refresh NASA FIRMS VIIRS satellite snapshot
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node scripts/fetch-firms-snapshot.js

      - name: Validate TypeScript types before committing
        run: npm run typecheck

      - name: Commit and push updated data
        env:
          # Branch rulesets block pushes from github-actions[bot]; pushing
          # with the owner's PAT (DATA_PUSH_TOKEN secret) makes the push
          # actor the Repository admin, who bypasses the ruleset.
          # Falls back to the default token when the secret is unset.
          PUSH_TOKEN: ${{ secrets.DATA_PUSH_TOKEN }}
        run: |
          PUSH_TOKEN="$(printf '%s' "$PUSH_TOKEN" | tr -d '[:space:]')"
          git config user.name "Sujaya Nimneth"
          git config user.email "sujayanimneth@outlook.com"
          git add \
            public/auto-events.json \
            public/auto-events-archive.json \
            src/features/impact/data/auto-consumer-impact.json \
            src/features/timeline/data/auto-war-costs.json \
            public/auto-daily-stats.json \
            public/firms-latest.json \
            scripts/draft-events.json \
            scripts/seen-headlines.json \
            scripts/youtube-latest.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          git commit -m "data(auto): scheduled conflict, market, and satellite update ($TODAY)"
          # Replay on top of anything pushed while this job ran
          git pull --rebase origin main
          if [ -n "$PUSH_TOKEN" ]; then
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/Sujaya-Nimneth/Oil-Burn-Tracker.git" HEAD:main
          else
            git push origin main
          fi

      # A failed scheduled run otherwise fails silently and the site serves
      # ever-staler data — file (or update) an alert issue instead.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Data pipeline failure — auto-update"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ISSUE_NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Scheduled run failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "A scheduled data-update run failed: $RUN_URL" --label "pipeline-alert" || \
            gh issue create --title "$TITLE" --body "A scheduled data-update run failed: $RUN_URL"
          fi
