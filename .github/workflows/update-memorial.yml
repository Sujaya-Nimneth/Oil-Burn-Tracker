name: Weekly Memorial Dataset Update

on:
  schedule:
    # Runs every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # data ships via auto-merged PR
  issues: write # failure alerts

# Serialize data-updating workflows so concurrent runs don't fail their push
# (shared with auto-update.yml — one data commit pipeline at a time).
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-memorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rebuild memorial dataset from upstream humanitarian registries
        run: python3 scripts/build-memorial-data.py

      # Data ships as a pull request from an unprotected branch, so the
      # require-PR ruleset on main is satisfied by design — no PAT, no
      # bypass, and the data commit passes the full CI gate before landing.
      - name: Ship memorial update via auto-merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Sujaya Nimneth"
          git config user.email "sujayanimneth@outlook.com"
          git add public/memorial-data.json public/casualty-anchors.json
          if git diff --cached --quiet; then
            echo "No changes to memorial data."
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          git commit -m "data(memorial): weekly humanitarian registry sync ($TODAY)"
          # Stay current with main, then move the commit to the data branch
          git fetch origin main
          git rebase origin/main
          BRANCH=data/memorial-update
          git checkout -B "$BRANCH"
          git push --force origin "$BRANCH"

          # Create the PR via the REST API so any failure surfaces verbatim
          API="https://api.github.com/repos/Sujaya-Nimneth/Oil-Burn-Tracker"
          CREATE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/pulls" \
            -d "{\"title\":\"data(memorial): weekly humanitarian registry sync ($TODAY)\",\"head\":\"$BRANCH\",\"base\":\"main\",\"body\":\"Automated memorial-dataset sync. Merges automatically once checks pass.\"}")
          PR_URL=$(echo "$CREATE" | grep -o '"html_url": *"[^"]*/pull/[0-9]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$PR_URL" ]; then
            # An open PR for this branch may already exist — find it
            PR_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "$API/pulls?head=Sujaya-Nimneth:$BRANCH&state=open" \
              | grep -o '"html_url": *"[^"]*/pull/[0-9]*"' | head -1 | cut -d'"' -f4)
          fi
          if [ -z "$PR_URL" ]; then
            echo "::error::Memorial PR creation failed: $(echo "$CREATE" | head -c 600)"
            exit 1
          fi
          echo "Memorial PR: $PR_URL"
          PR_NUM="${PR_URL##*/}"

          # Prefer auto-merge (waits for required checks once any are configured);
          # fall back to immediate merge while no checks are required
          MERGE_ERR=""
          if ! MERGE_ERR=$(gh pr merge "$PR_NUM" --squash --auto 2>&1); then
            if ! MERGE_ERR=$(gh pr merge "$PR_NUM" --squash 2>&1); then
              echo "::error::Memorial PR merge failed: ${MERGE_ERR:0:600} — $PR_URL"
              exit 1
            fi
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Data pipeline failure — memorial sync"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ISSUE_NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Scheduled run failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "A scheduled memorial-sync run failed: $RUN_URL"
          fi
